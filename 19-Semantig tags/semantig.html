<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Semantik Tag Nümunəsi</title>
</head>
<body>

    <!-- Səhifənin başlıq hissəsi -->
    <header>
        <h1>Bu Header hissəsidir</h1>
    </header>

    <!-- Naviqasiya menyusu -->
    <nav>
        <ul>
            <li><a href="#">Ana Səhifə</a></li>
            <li><a href="#">Haqqında</a></li>
            <li><a href="#">Əlaqə</a></li>
        </ul>
    </nav>

    <!-- Səhifənin əsas hissəsi -->
    <main>

        <!-- Bölmə (Section) -->
        <section>
            <h2>Bu Section hissəsidir</h2>

            <!-- Məqalə (Article) -->
            <article>
                <h3>Article nümunəsi</h3>
                <p>Bu bir məqalə məzmunudur.</p>
            </article>
        </section>

        <!-- Əlavə məlumatlar üçün Aside -->
        <aside>
            <p>Bu Aside hissəsidir (kənar məlumatlar).</p>
        </aside>

        <!-- Şəkil üçün Figure və Figcaption -->
        <figure>
            <img src="example.jpg" alt="Nümunə şəkil" width="200">
            <figcaption>Bu şəkil üçün açıqlama mətnidir.</figcaption>
        </figure>

        <!-- Vaxt/Tarix üçün Time tagı -->
        <p>Tarix: <time datetime="2025-11-17">17 Noyabr 2025</time></p>
        
    </main>

    <!-- Səhifənin alt hissəsi -->
    <footer>
        <p>Bu Footer hissəsidir.</p>
    </footer>

</body>
</html>
